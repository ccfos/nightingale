  mysql_global_status_uptime_since_flush_status: Число секунд с последнего выполнения FLUSH STATUS (Gauge)
  mysql_global_status_queries: "Число выполненных сервером операторов. В отличие от Questions, включает операторы внутри хранимых программ. Команды COM_PING и COM_STATISTICS не учитываются (Counter)"
