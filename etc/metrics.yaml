  diskio_iops_in_progress: "Запросы ввода-вывода, уже переданные драйверу устройства и ещё не завершённые. Запросы, стоящие в очереди, но не переданные драйверу, не учитываются. Тип gauge"
  diskio_merged_reads: Число слияний соседних запросов чтения. Тип counter
  diskio_merged_writes: Число слияний соседних запросов записи. Тип counter
  diskio_read_bytes: "Число прочитанных байт. Тип counter, значение имеет смысл только после применения функции rate"
  diskio_read_time: "Суммарное время запросов чтения (единица: миллисекунда). Тип counter, значение имеет смысл только после применения функции rate"
  diskio_reads: "Число запросов чтения. Тип counter, значение имеет смысл только после применения функции rate"
  diskio_weighted_io_time: "Суммарное время ожидания с точки зрения запросов ввода-вывода: при нескольких одновременных запросах время суммируется (единица: миллисекунда)"
  diskio_write_bytes: "Число записанных байт. Тип counter, значение имеет смысл только после применения функции rate"
  diskio_write_time: "Суммарное время запросов записи (единица: миллисекунда). Тип counter, значение имеет смысл только после применения функции rate"
  diskio_writes: "Число запросов записи. Тип counter, значение имеет смысл только после применения функции rate"
  kernel_boot_time: Время загрузки ядра
  kernel_context_switches: Число переключений контекста в ядре
  kernel_entropy_avail: Пул энтропии внутри системы Linux
  kernel_interrupts: Число прерываний ядра
  kernel_processes_forked: "Число процессов, созданных через fork"
  mem_active: Общий объём активно используемой памяти (включая cache и buffer)
  mem_available: Объём доступной памяти (bytes)
  mem_available_percent: Доля свободной памяти (0—100)
  mem_buffered: "Размер буфера, отведённого под файлы"
  mem_cached: "Объём памяти, занятый кэшем (cache memory), равен diskcache минус SwapCache"
  mem_commit_limit: "Общий объём памяти, который можно выделить в системе согласно коэффициенту переподписки ('vm.overcommit_ratio'). Ограничение действует только в режиме 2 ('vm.overcommit_memory')"
  mem_committed_as: "Объём памяти, выделенный в системе на текущий момент. Сумма памяти, запрошенной всеми процессами"
  mem_dirty: "Объём памяти, ожидающей записи обратно на диск"
  mem_free: Объём свободной памяти (bytes)
  mem_high_free: Объём неиспользуемой памяти в области high
  mem_high_total: "Общий объём памяти в области high (HighMem — вся физическая память выше 860 МБ; область используется пользовательскими программами и страничным кэшем. Она не отображается напрямую в пространство ядра, поэтому ядро обращается к ней иначе)"
  mem_huge_page_size: Размер одной huge page
  mem_huge_pages_free: Число ещё не выделенных HugePages в пуле
  mem_huge_pages_total: Общее число зарезервированных HugePages
  mem_inactive: Объём неиспользуемой памяти (включая free и available)
  mem_low_free: Объём неиспользуемой памяти в области low
  mem_low_total: "Общий объём памяти в области low. Область low может выполнять те же задачи, что и high, и вдобавок используется ядром для хранения собственных структур данных"
  mem_mapped: Объём отображений устройств и файлов
  mem_page_tables: "Размер таблиц страниц, управляющих страничной организацией памяти"
  mem_shared: "Общий объём памяти, разделяемой несколькими процессами"
  mem_slab: Размер кэша структур данных ядра. Позволяет сократить расходы на выделение и освобождение памяти
  mem_sreclaimable: Размер возвращаемой части Slab
  mem_sunreclaim: Размер невозвращаемой части Slab (SUnreclaim + SReclaimable = Slab)
  mem_swap_cached: "Объём пространства подкачки, занятый кэшем (cache memory): память, уже вытесненная в swap, но всё ещё хранящаяся в swapfile. Позволяет быстро вернуть данные без повторного обращения к вводу-выводу"
  mem_swap_free: Объём неиспользуемого пространства подкачки
  mem_swap_total: Общий объём пространства подкачки
  mem_total: Общий объём памяти
  mem_used: Объём использованной памяти
  mem_used_percent: Доля использованной памяти (0—100)
  mem_vmalloc_chunk: Наибольшая непрерывная неиспользуемая область vmalloc
  mem_vmalloc_totalL: "Объём виртуальной памяти, доступной для vmalloc"
  mem_vmalloc_used: "Объём виртуальной памяти, уже занятой vmalloc"
  mem_write_back: "Объём памяти, записываемой обратно на диск"
  mem_write_back_tmp: "Память, используемая FUSE под временный буфер обратной записи"
  net_bytes_recv: Всего принято байт сетевым интерфейсом (bytes). Для скорости в секунду используйте функции rate/irate
  net_bytes_sent: Всего отправлено байт сетевым интерфейсом (bytes). Для скорости в секунду используйте функции rate/irate
  net_bits_recv: Всего принято бит сетевым интерфейсом (bits). Для скорости в секунду используйте функции rate/irate
  net_bits_sent: Всего отправлено бит сетевым интерфейсом (bits). Для скорости в секунду используйте функции rate/irate
  net_drop_in: Число отброшенных входящих пакетов сетевого интерфейса
  net_drop_out: Число отброшенных исходящих пакетов сетевого интерфейса
