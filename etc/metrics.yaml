ja:
  ip_conntrack_count: "コネクション追跡テーブルのエントリ総数（単位：int, count）"
  ip_conntrack_max: "コネクション追跡テーブルの最大容量（単位：int, size）"
  cpu_usage_idle: "CPU アイドル率（単位：%）"
  cpu_usage_active: "CPU 使用率（単位：%）"
  cpu_usage_system: "CPU カーネルモード時間の割合（単位：%）"
  cpu_usage_user: "CPU ユーザーモード時間の割合（単位：%）"
  cpu_usage_nice: "低優先度ユーザーモードの CPU 時間の割合。つまりプロセスの nice 値が 1〜19 に調整された CPU 時間。なお nice の値域は -20〜19 で、値が大きいほど優先度は低くなる（単位：%）"
  cpu_usage_iowait: "CPU が I/O を待機した時間の割合（単位：%）"
  cpu_usage_irq: "CPU がハードウェア割り込みを処理した時間の割合（単位：%）"
  cpu_usage_softirq: "CPU がソフトウェア割り込みを処理した時間の割合（単位：%）"
  cpu_usage_steal: "仮想マシン環境で取得できる指標で、CPU が他の仮想マシンに奪われた時間の割合。20 を超えると競合が深刻（単位：%）"
  cpu_usage_guest: "仮想化により他の OS を実行した時間、つまり仮想マシンを動かした CPU 時間の割合（単位：%）"
  cpu_usage_guest_nice: "低優先度で仮想マシンを実行した時間の割合（単位：%）"
  disk_free: ディスクパーティションの空き容量（単位：byte）
  disk_used: ディスクパーティションの使用量（単位：byte）
  disk_used_percent: "ディスクパーティションの使用率（単位：%）"
  disk_total: ディスクパーティションの総容量（単位：byte）
  disk_inodes_free: ディスクパーティションの inode 残量
  disk_inodes_used: ディスクパーティションの inode 使用量
  disk_inodes_total: ディスクパーティションの inode 総数
  diskio_io_time: デバイス視点での I/O リクエスト総時間。キューに I/O リクエストがあればカウントされる（単位：ミリ秒）。counter 型のため、rate 関数で変化率を求めて使う
  diskio_iops_in_progress: デバイスドライバに割り当て済みで未完了の IO リクエスト。キューにあるがまだドライバに割り当てられていないものは含まない。gauge 型
  diskio_merged_reads: 隣接する読み取りリクエストがマージされた回数。counter 型
  diskio_merged_writes: 隣接する書き込みリクエストがマージされた回数。counter 型
  diskio_read_bytes: 読み取ったバイト数。counter 型のため、rate 関数で変化率を求めて使う
  diskio_read_time: 読み取りリクエストの総時間（単位：ミリ秒）。counter 型のため、rate 関数で変化率を求めて使う
  diskio_reads: 読み取りリクエストの回数。counter 型のため、rate 関数で変化率を求めて使う
  diskio_weighted_io_time: I/O リクエスト視点での待機総時間。複数の I/O リクエストが同時にある場合は時間が加算される（単位：ミリ秒）
  diskio_write_bytes: 書き込んだバイト数。counter 型のため、rate 関数で変化率を求めて使う
  diskio_write_time: 書き込みリクエストの総時間（単位：ミリ秒）。counter 型のため、rate 関数で変化率を求めて使う
  diskio_writes: 書き込みリクエストの回数。counter 型のため、rate 関数で変化率を求めて使う
  kernel_boot_time: カーネルの起動時刻
  kernel_context_switches: カーネルのコンテキストスイッチ回数
  kernel_entropy_avail: Linux システム内部のエントロピープール
  kernel_interrupts: カーネルの割り込み回数
  kernel_processes_forked: fork されたプロセス数
  mem_active: アクティブに使用されているメモリの総量（cache と buffer を含む）
  mem_available: 利用可能なメモリサイズ（bytes）
  mem_available_percent: メモリ残量の割合（0〜100）
  mem_buffered: ファイルのバッファに使われているサイズ
  mem_cached: キャッシュメモリ（cache memory）が使用しているメモリサイズ（diskcache から SwapCache を引いた値）
  mem_commit_limit: "オーバーコミット率（'vm.overcommit_ratio'）に基づき、現在システムに割り当て可能なメモリ総量。この制限はモード 2（'vm.overcommit_memory'）のときのみ有効"
  mem_committed_as: 現在システム上で割り当てられているメモリ量。全プロセスが要求したメモリの合計
  mem_dirty: ディスクへの書き戻しを待っているメモリサイズ
  mem_free: 空きメモリサイズ（bytes）
  mem_high_free: 使用されていない high メモリのサイズ
  mem_high_total: high メモリの総サイズ（HighMem は 860MB を超える物理メモリを指し、ユーザープログラムやページキャッシュに使われる。この領域はカーネル空間に直接マップされないため、カーネルは別の方法でアクセスする必要がある）
  mem_huge_page_size: ヒュージページ 1 枚あたりのサイズ
  mem_huge_pages_free: プール内でまだ割り当てられていない HugePages の数
  mem_huge_pages_total: 予約された HugePages の総数
  mem_inactive: 未使用のメモリ量（free と available の両方を含む）
  mem_low_free: 使用されていない low メモリのサイズ
  mem_low_total: low メモリの総サイズ。low メモリは high メモリと同じ用途に使えるうえ、カーネル自身のデータ構造の保持にも使える
  mem_mapped: デバイスやファイルなどのマッピングのサイズ
  mem_page_tables: メモリページング管理用インデックステーブルのサイズ
  mem_shared: 複数プロセスで共有されているメモリの総量
  mem_slab: カーネルデータ構造キャッシュのサイズ。メモリの確保と解放にかかるコストを削減できる
  mem_sreclaimable: 回収可能な Slab のサイズ
  mem_sunreclaim: 回収できない Slab のサイズ（SUnreclaim + SReclaimable ＝ Slab）
  mem_swap_cached: キャッシュメモリ（cache memory）が使用しているスワップ空間のサイズ。すでにスワップアウトされたが swapfile にも残っているメモリで、必要時に I/O を再度開かずに素早く復帰できる
  mem_swap_free: 使用されていないスワップ空間のサイズ
  mem_swap_total: スワップ空間の総サイズ
  mem_total: メモリ総量
  mem_used: 使用済みメモリ量
  mem_used_percent: 使用済みメモリの割合（0〜100）
  mem_vmalloc_chunk: 未使用で連続した最大の vmalloc 領域
  mem_vmalloc_totalL: vmalloc 可能な仮想メモリのサイズ
  mem_vmalloc_used: vmalloc が使用済みの仮想メモリサイズ
  mem_write_back: ディスクへ書き戻し中のメモリサイズ
  mem_write_back_tmp: FUSE が一時的な書き戻しバッファに使用しているメモリ
  net_bytes_recv: NIC の受信バイト総数（bytes）。毎秒レートを求めるには rate/irate 関数を使う
  net_bytes_sent: NIC の送信バイト総数（bytes）。毎秒レートを求めるには rate/irate 関数を使う
  net_bits_recv: NIC の受信ビット総数（bits）。毎秒レートを求めるには rate/irate 関数を使う
  net_bits_sent: NIC の送信ビット総数（bits）。毎秒レートを求めるには rate/irate 関数を使う
  net_drop_in: NIC の受信ドロップパケット数
  net_drop_out: NIC の送信ドロップパケット数
  net_err_in: NIC の受信エラーパケット数
  net_err_out: NIC の送信エラーパケット数
  net_packets_recv: NIC の受信パケット数
  net_packets_sent: NIC の送信パケット数
  netstat_tcp_established: ESTABLISHED 状態のネットワーク接続数
  netstat_tcp_fin_wait1: FIN_WAIT1 状態のネットワーク接続数
  netstat_tcp_fin_wait2: FIN_WAIT2 状態のネットワーク接続数
  netstat_tcp_last_ack: LAST_ACK 状態のネットワーク接続数
  netstat_tcp_listen: LISTEN 状態のネットワーク接続数
  netstat_tcp_syn_recv: SYN_RECV 状態のネットワーク接続数
  netstat_tcp_syn_sent: SYN_SENT 状態のネットワーク接続数
  netstat_tcp_time_wait: TIME_WAIT 状態のネットワーク接続数
  netstat_udp_socket: UDP 状態のネットワーク接続数
  processes_blocked: "割り込み不可能なスリープ状態のプロセス数（'U','D','L'）"
  processes_dead: "回収中のプロセス数（'X'）"
  processes_idle: "サスペンド中のアイドルプロセス数（'I'）"
  processes_paging: "ページング中のプロセス数（'P'）"
  processes_running: "実行中のプロセス数（'R'）"
  processes_sleeping: "割り込み可能なプロセス数（'S'）"
  processes_stopped: "停止状態のプロセス数（'T'）"
  processes_total: 総プロセス数
  processes_total_threads: 総スレッド数
  processes_unknown: 状態が不明なプロセス数
  processes_zombies: "ゾンビ状態のプロセス数（'Z'）"
  swap_used_percent: Swap 空間へスワップアウトされたデータ量
  system_load1: 1 分間の平均ロード値
  system_load5: 5 分間の平均ロード値
  system_load15: 15 分間の平均ロード値
  system_load_norm_1: 1 分間の平均ロード値 / 論理 CPU 数
  system_load_norm_5: 5 分間の平均ロード値 / 論理 CPU 数
  system_load_norm_15: 15 分間の平均ロード値 / 論理 CPU 数
  system_n_users: ユーザー数
  system_n_cpus: CPU コア数
  system_uptime: システムの稼働時間
  nginx_accepts: nginx 起動以降にクライアントと確立した接続の総数
  nginx_active: nginx が現在処理中のアクティブ接続数。Reading/Writing/Waiting の合計に等しい
  nginx_handled: nginx 起動以降に処理したクライアント接続の総数
  nginx_reading: HTTP リクエストヘッダを読み取り中の接続総数
  nginx_requests: nginx 起動以降に処理したクライアントリクエストの総数。HTTP Keep-Alive があるため handled より大きくなる
  nginx_upstream_check_fall: upstream_check モジュールがバックエンドの障害を検知した回数
  nginx_upstream_check_rise: upstream_check モジュールがバックエンドを検査した回数
  nginx_upstream_check_status_code: バックエンド upstream の状態。up が 1、down が 0
  nginx_waiting: keep-alive が有効な場合、この値は active −（reading + writing）に等しい。つまり nginx が処理を終え、次のリクエストを待っている常駐接続
  nginx_writing: クライアントへレスポンスを送信中の接続総数
  http_response_content_length: HTTP メッセージボディの転送長
  http_response_http_response_code: HTTP レスポンスステータスコード
  http_response_response_time: HTTP レスポンスにかかった時間
  http_response_result_code: URL 監視の結果。0 が正常で、それ以外は URL にアクセスできないことを示す
  mysql_global_status_uptime: サーバーが起動してからの秒数（Gauge）
  mysql_global_status_uptime_since_flush_status: 直近の FLUSH STATUS 実行からの秒数（Gauge）
  mysql_global_status_queries: サーバーが実行したステートメント数。Questions と異なり、ストアドプログラム内で実行されたものも含む。COM_PING と COM_STATISTICS はカウントしない（Counter）
  mysql_global_status_threads_connected: 現在オープンしている接続の数（Counter）
  mysql_global_status_connections: MySQL サーバーへの接続試行回数（成功・失敗を問わない）（Gauge）
  mysql_global_status_max_used_connections: サーバー起動以降に同時使用された接続数の最大値（Gauge）
  mysql_global_status_threads_running: スリープ状態にないスレッドの数（Gauge）
  mysql_global_status_questions: サーバーが実行したステートメント数。Queries と異なり、クライアントから送られたものだけを数え、ストアドプログラム内の実行は含まない。COM_PING、COM_STATISTICS、COM_STMT_PREPARE、COM_STMT_CLOSE、COM_STMT_RESET もカウントしない（Counter）
  mysql_global_status_threads_cached: スレッドキャッシュ内のスレッド数（Counter）
  mysql_global_status_threads_created: 接続処理のために作成されたスレッド数。この値が大きい場合は thread_cache_size を増やすとよい。キャッシュミス率は Threads_created/Connections で計算できる（Counter）
  mysql_global_status_created_tmp_tables: ステートメント実行中にサーバーが作成した内部一時テーブルの数（Counter）
  mysql_global_status_created_tmp_disk_tables: ステートメント実行中にサーバーが作成したディスク上の内部一時テーブル数。Created_tmp_disk_tables と Created_tmp_tables を比較すると、ディスクに落ちた割合が分かる（Counter）
  mysql_global_status_created_tmp_files: mysqld が作成した一時ファイルの数（Counter）
  mysql_global_status_select_full_join: インデックスを使わずテーブルスキャンを行った結合の数。0 でない場合はテーブルのインデックスを見直すこと（Counter）
  mysql_global_status_select_full_range_join: 参照テーブルに対して範囲検索を使った結合の数（Counter）
  mysql_global_status_select_range: 最初のテーブルで範囲検索を使った結合の数。値が大きくても通常は問題にならない（Counter）
  mysql_global_status_select_range_check: キーを使わず、各行ごとにキー利用可否を確認した結合の数。0 でない場合はテーブルのインデックスを見直すこと（Counter）
  mysql_global_status_select_scan: 最初のテーブルをフルスキャンした結合の数（Counter）
  mysql_global_status_sort_rows: ソートされた行数（Counter）
  mysql_global_status_sort_range: 範囲を使って行われたソートの数（Counter）
  mysql_global_status_sort_merge_passes: ソートアルゴリズムが実行したマージパスの数。値が大きい場合は sort_buffer_size を増やすことを検討する（Counter）
  mysql_global_status_sort_scan: テーブルスキャンによって行われたソートの数（Counter）
  mysql_global_status_slow_queries: long_query_time 秒を超えたクエリの数。スロークエリログの有効・無効に関わらずカウントされる（Counter）
  mysql_global_status_aborted_connects: MySQL サーバーへの接続に失敗した回数（Counter）
  mysql_global_status_aborted_clients: クライアントが接続を正しく閉じずに終了したため中断された接続の数（Counter）
  mysql_global_status_table_locks_immediate: テーブルロック要求が即座に許可された回数。増減すること自体は正常な挙動（Counter）
  mysql_global_status_table_locks_waited: テーブルロック要求が即座に許可されず待機が必要だった回数。この値が高く性能問題がある場合は、まずクエリを最適化し、次にテーブル分割やレプリケーションを検討する（Counter）
  mysql_global_status_bytes_received: 全クライアントから受信したバイト数（Counter）
  mysql_global_status_bytes_sent: 全クライアントへ送信したバイト数（Counter）
  mysql_global_status_innodb_page_size: InnoDB のページサイズ（デフォルト 16KB）。多くの値がページ単位で数えられるため、これを使ってバイトへ換算できる（Gauge）
  mysql_global_status_buffer_pool_pages: InnoDB バッファプール内のページ数（Gauge）
  mysql_global_status_commands_total: 各ステートメントが実行された回数（Counter）
  mysql_global_status_handlers_total: ハンドラ統計。MySQL が行・テーブル・インデックスをどのように選択、更新、挿入、変更しているかを示す内部統計で、ストレージエンジンと MySQL の間の層にあたる（Counter）
  mysql_global_status_opened_files: my_open()（mysys ライブラリの関数）でオープンされたファイルの数。この関数を使わずにファイルを開く部分はカウントされない（Counter）
  mysql_global_status_open_tables: オープン中のテーブル数（Gauge）
  mysql_global_status_opened_tables: オープンされたテーブルの累計数。この値が大きい場合は table_open_cache が小さすぎる可能性がある（Counter）
  mysql_global_status_table_open_cache_hits: オープンテーブルキャッシュ参照のヒット数（Counter）
  mysql_global_status_table_open_cache_misses: オープンテーブルキャッシュ参照のミス数（Counter）
  mysql_global_status_table_open_cache_overflows: オープンテーブルキャッシュのオーバーフロー回数（Counter）
  mysql_global_status_innodb_num_open_files: InnoDB が現在オープンしているファイルの数（Gauge）
  mysql_global_status_connection_errors_total: クライアント接続処理中に発生したエラーの情報（Counter）
  mysql_global_status_innodb_buffer_pool_read_requests: 論理読み取りリクエストの数（Counter）
  mysql_global_status_innodb_buffer_pool_reads: InnoDB がバッファプールから返せず、ディスクから直接読む必要があった論理読み取りの数（Counter）
  mysql_global_variables_thread_cache_size: 再利用のためにサーバーがキャッシュするスレッド数（Gauge）
  mysql_global_variables_max_connections: 同時クライアント接続の許容最大数（Gauge）
  mysql_global_variables_innodb_buffer_pool_size: バッファプールのサイズ（バイト）。InnoDB がテーブルとインデックスのデータをキャッシュするメモリ領域で、デフォルトは 134217728 バイト（128MB）（Gauge）
  mysql_global_variables_innodb_log_buffer_size: InnoDB がディスク上のログファイルへ書き込むために使うバッファのサイズ（バイト）（Gauge）
  mysql_global_variables_key_buffer_size: MyISAM テーブルのインデックスブロックをバッファリングするサイズ。全スレッドで共有される（Gauge）
  mysql_global_variables_query_cache_size: クエリ結果のキャッシュに割り当てられたメモリ量（Gauge）
  mysql_global_variables_table_open_cache: 全スレッド分のオープンテーブル数（Gauge）
  mysql_global_variables_open_files_limit: OS から mysqld に割り当てられたファイルディスクリプタの数（Gauge）
  redis_active_defrag_running: activedefrag が有効な場合に、デフラグが現在実行中かどうかと、使用予定の CPU 割合を示す
  redis_allocator_active_bytes: アロケータのアクティブページ内の総バイト数。外部フラグメンテーションを含む
  redis_allocator_allocated_bytes: アロケータから割り当てられた総バイト数。内部フラグメンテーションを含む。通常は used_memory と同じ
  redis_allocator_frag_bytes: allocator_active と allocator_allocated の差分。mem_fragmentation_bytes の注意書きも参照
  redis_allocator_frag_ratio: allocator_active と allocator_allocated の比率。これが真の（外部）フラグメンテーション指標であり、mem_fragmentation_ratio ではない
  redis_allocator_resident_bytes: アロケータ内で常駐（RSS）している総バイト数。MEMORY PURGE などで OS に返却できるページも含む
  redis_allocator_rss_bytes: allocator_resident と allocator_active の差分
  redis_allocator_rss_ratio: allocator_resident と allocator_active の比率。通常、アロケータが近く OS へ返却できるページの量を示す
  redis_aof_current_rewrite_duration_sec: 進行中の AOF リライト処理の経過時間
  redis_aof_enabled: AOF ログが有効かどうかを示すフラグ
  redis_aof_last_bgrewrite_status: 直近の AOF リライト処理のステータス
  redis_aof_last_cow_size_bytes: 直近の AOF リライト処理中のコピーオンライトメモリのサイズ（バイト）
  redis_aof_last_rewrite_duration_sec: 直近の AOF リライト処理にかかった秒数
  redis_aof_last_write_status: 直近の AOF 書き込み処理のステータス
