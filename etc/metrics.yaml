  mysql_global_status_select_range: "Число соединений, использовавших диапазоны в первой таблице. Даже большое значение обычно не является проблемой (Counter)"
  mysql_global_status_select_range_check: "Число соединений без ключей, проверяющих возможность использования ключа после каждой строки. Если значение не 0, проверьте индексы таблиц (Counter)"
  mysql_global_status_select_scan: "Число соединений, выполнивших полное сканирование первой таблицы (Counter)"
  mysql_global_status_sort_rows: Число отсортированных строк (Counter)
  mysql_global_status_sort_range: "Число сортировок, выполненных по диапазонам (Counter)"
  mysql_global_status_sort_merge_passes: "Число проходов слияния, выполненных алгоритмом сортировки. При большом значении стоит увеличить sort_buffer_size (Counter)"
