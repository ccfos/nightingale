  mysql_global_status_slow_queries: "Число запросов, выполнявшихся дольше long_query_time секунд. Счётчик растёт независимо от того, включён ли лог медленных запросов (Counter)"
  mysql_global_status_aborted_connects: Число неудачных попыток подключения к серверу MySQL (Counter)
  mysql_global_status_aborted_clients: "Число соединений, прерванных из-за того, что клиент завершился, не закрыв соединение корректно (Counter)"
  mysql_global_status_table_locks_immediate: "Число случаев, когда блокировка таблицы была выдана немедленно. Рост и спад этого значения — нормальное поведение (Counter)"
  mysql_global_status_table_locks_waited: "Число случаев, когда блокировку таблицы пришлось ждать. При высоком значении и проблемах с производительностью сначала оптимизируйте запросы, затем рассмотрите разделение таблиц или репликацию (Counter)"
  mysql_global_status_bytes_received: "Число байт, принятых от всех клиентов (Counter)"
  mysql_global_status_bytes_sent: "Число байт, отправленных всем клиентам (Counter)"
  mysql_global_status_innodb_page_size: "Размер страницы InnoDB (по умолчанию 16 КБ). Многие величины считаются в страницах, и через этот размер их легко перевести в байты (Gauge)"
  mysql_global_status_buffer_pool_pages: Число страниц в буферном пуле InnoDB (Gauge)
  mysql_global_status_commands_total: Число выполнений каждого оператора (Counter)
  mysql_global_status_handlers_total: "Статистика обработчиков — внутренняя статистика того, как MySQL выбирает, обновляет, вставляет и изменяет строки, таблицы и индексы. Это слой между движком хранения и MySQL (Counter)"
  mysql_global_status_opened_files: "Число файлов, открытых через my_open() — функцию библиотеки mysys. Части сервера, открывающие файлы без неё, счётчик не увеличивают (Counter)"
  mysql_global_status_open_tables: Число открытых таблиц (Gauge)
  mysql_global_status_opened_tables: "Общее число открытых таблиц. Если значение велико, table_open_cache, вероятно, слишком мал (Counter)"
  mysql_global_status_table_open_cache_hits: Число попаданий при обращении к кэшу открытых таблиц (Counter)
  mysql_global_status_table_open_cache_misses: Число промахов при обращении к кэшу открытых таблиц (Counter)
  mysql_global_status_table_open_cache_overflows: Число переполнений кэша открытых таблиц (Counter)
  mysql_global_status_innodb_num_open_files: "Число файлов, открытых InnoDB сейчас (Gauge)"
  mysql_global_status_connection_errors_total: "Информация об ошибках, возникших при подключении клиентов (Counter)"
  mysql_global_status_innodb_buffer_pool_read_requests: Число логических запросов чтения (Counter)
  mysql_global_status_innodb_buffer_pool_reads: "Число логических чтений, которые InnoDB не смог выполнить из буферного пула и был вынужден читать с диска (Counter)"
  mysql_global_variables_thread_cache_size: Сколько потоков сервер держит в кэше для повторного использования (Gauge)
  mysql_global_variables_max_connections: Максимально допустимое число одновременных клиентских подключений (Gauge)
  mysql_global_variables_innodb_buffer_pool_size: "Размер буферного пула в байтах — области памяти, где InnoDB кэширует данные таблиц и индексов. Значение по умолчанию 134217728 байт (128 МБ) (Gauge)"
  mysql_global_variables_innodb_log_buffer_size: "Размер буфера в байтах, который InnoDB использует для записи в файлы журнала на диске (Gauge)"
  mysql_global_variables_key_buffer_size: Размер буфера для блоков индексов таблиц MyISAM. Буфер общий для всех потоков (Gauge)
  mysql_global_variables_query_cache_size: "Объём памяти, выделенный под кэширование результатов запросов (Gauge)"
  mysql_global_variables_table_open_cache: Число открытых таблиц для всех потоков (Gauge)
  mysql_global_variables_open_files_limit: "Число файловых дескрипторов, доступных mysqld от операционной системы (Gauge)"
  redis_active_defrag_running: "Когда включён activedefrag, показывает, идёт ли дефрагментация сейчас и какую долю CPU она собирается использовать"
  redis_allocator_active_bytes: "Всего байт в активных страницах аллокатора, включая внешнюю фрагментацию"
  redis_allocator_allocated_bytes: "Всего байт, выделенных аллокатором, включая внутреннюю фрагментацию. Обычно совпадает с used_memory"
