  net_err_out: Число ошибочных исходящих пакетов сетевого интерфейса
  net_packets_recv: Число принятых пакетов сетевого интерфейса
  net_packets_sent: Число отправленных пакетов сетевого интерфейса
  netstat_tcp_established: Число сетевых соединений в состоянии ESTABLISHED
  netstat_tcp_fin_wait1: Число сетевых соединений в состоянии FIN_WAIT1
  netstat_tcp_fin_wait2: Число сетевых соединений в состоянии FIN_WAIT2
  netstat_tcp_last_ack: Число сетевых соединений в состоянии LAST_ACK
  netstat_tcp_listen: Число сетевых соединений в состоянии LISTEN
  netstat_tcp_syn_recv: Число сетевых соединений в состоянии SYN_RECV
  netstat_tcp_syn_sent: Число сетевых соединений в состоянии SYN_SENT
  netstat_tcp_time_wait: Число сетевых соединений в состоянии TIME_WAIT
  netstat_udp_socket: Число сетевых соединений в состоянии UDP
  processes_blocked: "Число процессов в непрерываемом состоянии сна ('U','D','L')"
  processes_dead: "Число процессов в состоянии освобождения ('X')"
  processes_idle: "Число простаивающих приостановленных процессов ('I')"
  processes_paging: "Число процессов в состоянии подкачки страниц ('P')"
  processes_running: "Число выполняющихся процессов ('R')"
  processes_sleeping: "Число процессов в прерываемом сне ('S')"
  processes_stopped: "Число остановленных процессов ('T')"
  processes_total: Общее число процессов
  processes_total_threads: Общее число потоков
  processes_unknown: Число процессов с неизвестным состоянием
  processes_zombies: "Число процессов-зомби ('Z')"
  swap_used_percent: "Объём данных, вытесненных в пространство подкачки"
  system_load1: Средняя загрузка за 1 минуту
  system_load5: Средняя загрузка за 5 минут
  system_load15: Средняя загрузка за 15 минут
  system_load_norm_1: Средняя загрузка за 1 минуту / число логических CPU
  system_load_norm_5: Средняя загрузка за 5 минут / число логических CPU
  system_load_norm_15: Средняя загрузка за 15 минут / число логических CPU
  system_n_users: Число пользователей
  system_n_cpus: Число ядер CPU
  system_uptime: Время работы системы
  nginx_accepts: "Общее число соединений, установленных с клиентами с момента запуска nginx"
  nginx_active: "Число активных соединений, обрабатываемых nginx сейчас. Равно сумме Reading/Writing/Waiting"
  nginx_handled: "Общее число клиентских соединений, обработанных с момента запуска nginx"
  nginx_reading: "Число соединений, у которых сейчас читается заголовок HTTP-запроса"
  nginx_requests: "Общее число клиентских запросов, обработанных с момента запуска nginx. Из-за HTTP Keep-Alive значение больше, чем handled"
