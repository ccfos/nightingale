  mysql_global_status_connections: "Число попыток подключения к серверу MySQL, успешных и неуспешных (Gauge)"
  mysql_global_status_max_used_connections: Максимальное число одновременно использованных подключений с момента запуска сервера (Gauge)
  mysql_global_status_threads_running: "Число потоков, не находящихся в состоянии сна (Gauge)"
  mysql_global_status_questions: "Число выполненных сервером операторов. В отличие от Queries, учитываются только операторы, присланные клиентами, без операторов внутри хранимых программ. Команды COM_PING, COM_STATISTICS, COM_STMT_PREPARE, COM_STMT_CLOSE и COM_STMT_RESET не учитываются (Counter)"
  mysql_global_status_threads_cached: Число потоков в кэше потоков (Counter)
  mysql_global_status_threads_created: "Число потоков, созданных для обработки подключений. Если значение велико, стоит увеличить thread_cache_size. Доля промахов кэша считается как Threads_created/Connections (Counter)"
  mysql_global_status_created_tmp_tables: "Число внутренних временных таблиц, созданных сервером при выполнении операторов (Counter)"
  mysql_global_status_created_tmp_disk_tables: "Число внутренних временных таблиц на диске, созданных сервером при выполнении операторов. Сравнение Created_tmp_disk_tables и Created_tmp_tables показывает, какая доля ушла на диск (Counter)"
  mysql_global_status_created_tmp_files: "Число временных файлов, созданных mysqld (Counter)"
  mysql_global_status_select_full_join: "Число соединений таблиц, выполненных полным сканированием из-за отсутствия индексов. Если значение не 0, проверьте индексы таблиц (Counter)"
