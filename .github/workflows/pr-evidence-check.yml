name: pr-evidence-check

# Gate for PRs from external contributors: a linked issue that was discussed
# first, evidence that the author ran the change on a real instance, and limits
# on PR size and open PRs. A PR that does not qualify is labeled (`needs-issue`
# / `needs-evidence` / `over-limit`), gets an explanatory comment and is closed;
# editing the description re-runs the check and reopens it. Maintainers can
# waive it with the `skip-evidence-check` label, or only the size limit with
# `skip-size-limit`.
#
# The PR template is only pre-filled in the web UI; PRs opened via
# `gh pr create` (typical for automated / AI-generated submissions) bypass it
# entirely, so the actual gate lives here. The rules are in
# .github/scripts/pr-gate.js and, for contributors, in CONTRIBUTING.md.
#
# Uses pull_request_target so the token can label/comment/close on fork PRs.
# It never checks out or runs PR code: the script comes from the default branch
# and only reads the PR description, changed file names and linked issues.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-evidence-check-${{ github.event.pull_request.number }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Saves a runner for the common case; pr-gate.js applies the full trust rules.
    if: >-
      ${{ !github.event.pull_request.merged
      && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/pr-gate.js')({ github, context, core });
