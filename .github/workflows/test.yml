name: test

# Unit tests with coverage. Tests that need a live MySQL/PostgreSQL/ClickHouse/
# VictoriaLogs carry the `integration` build tag and are excluded here; run them
# locally with `go test -tags integration ./...` against real services.
#
# All packages are tested, but the coverage report excludes cmd/ (main
# entrypoints and dev CLIs) and front/statik/ (generated frontend bundle).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run unit tests
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Filter coverage profile
        run: grep -v -E '^github.com/ccfos/nightingale/v6/(cmd|front/statik)/' coverage.out > coverage.filtered.out
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.filtered.out
          format: golang
          fail-on-error: false
