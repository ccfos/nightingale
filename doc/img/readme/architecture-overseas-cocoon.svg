    <text x="114" y="456" fill="#94a3b8" font-size="9" text-anchor="middle">SQL</text>
  </g>
  <g data-component="PostgreSQL">
    <rect x="200" y="412" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="200" y="412" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="270" y="437" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL</text>
    <text x="270" y="456" fill="#94a3b8" font-size="9" text-anchor="middle">SQL</text>
  </g>
  <g data-component="Slack">
    <rect x="860" y="132" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="860" y="132" width="140" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="930" y="157" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Slack</text>
    <text x="930" y="176" fill="#94a3b8" font-size="9" text-anchor="middle">Team messaging</text>
  </g>
  <g data-component="PagerDuty">
    <rect x="1016" y="132" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="1016" y="132" width="140" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1086" y="157" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">PagerDuty</text>
    <text x="1086" y="176" fill="#94a3b8" font-size="9" text-anchor="middle">Incident management</text>
  </g>
  <g data-component="Discord">
    <rect x="860" y="272" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="860" y="272" width="140" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="930" y="297" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Discord</text>
    <text x="930" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">Team messaging</text>
  </g>
  <g data-component="Email">
    <rect x="1016" y="272" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="1016" y="272" width="140" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1086" y="297" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Email</text>
    <text x="1086" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">Mail delivery</text>
  </g>
  <g data-component="Telegram">
    <rect x="860" y="412" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="860" y="412" width="140" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="930" y="437" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Telegram</text>
    <text x="930" y="456" fill="#94a3b8" font-size="9" text-anchor="middle">Team messaging</text>
  </g>
  <g data-component="Jira">
    <rect x="1016" y="412" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="1016" y="412" width="140" height="60" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1086" y="437" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Jira</text>
    <text x="1086" y="456" fill="#94a3b8" font-size="9" text-anchor="middle">Issue tracking</text>
  </g>

  <g fill="#64748b" font-size="9">
    <text x="44" y="507">Metrics / logs / SQL</text>
    <text x="860" y="507">Notification integrations</text>
  </g>

  <!-- Nightingale boundary includes its AI and MCP capabilities. -->
  <rect x="470" y="76" width="260" height="454" rx="10" fill="#0f172a"/>
  <rect x="470" y="76" width="260" height="454" rx="10" fill="rgba(6,78,59,0.16)" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="113" fill="#f8fafc" font-size="23" font-weight="700" text-anchor="middle">Nightingale</text>
  <text x="600" y="136" fill="#94a3b8" font-size="10" text-anchor="middle">Open-source alerting</text>

  <!-- Stage connectors sit in 40px gaps and are behind the stage boxes. -->
  <g fill="none" stroke="#34d399" stroke-width="1.25" marker-end="url(#engine-arrowhead)">
    <path d="M600 230 V267"/>
    <path d="M600 330 V367"/>
  </g>
  <path d="M470 200 H492 M708 400 H730" fill="none" stroke="#34d399" stroke-width="1.25"/>

  <g data-component="Alert rules">
    <rect x="492" y="170" width="216" height="60" rx="6" fill="#0f172a"/>
    <rect x="492" y="170" width="216" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="600" y="195" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Alert rules</text>
    <text x="600" y="214" fill="#94a3b8" font-size="9" text-anchor="middle">Evaluate query results</text>
  </g>
  <g data-component="Event processing">
    <rect x="492" y="270" width="216" height="60" rx="6" fill="#0f172a"/>
    <rect x="492" y="270" width="216" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="600" y="295" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Event processing</text>
    <text x="600" y="314" fill="#94a3b8" font-size="9" text-anchor="middle">Enrich and transform events</text>
  </g>
  <g data-component="Notification routing">
    <rect x="492" y="370" width="216" height="60" rx="6" fill="#0f172a"/>
    <rect x="492" y="370" width="216" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="600" y="395" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Notification routing</text>
    <text x="600" y="414" fill="#94a3b8" font-size="9" text-anchor="middle">Select notification destinations</text>
  </g>

  <circle cx="470" cy="200" r="3" fill="#34d399"/>
  <circle cx="730" cy="400" r="3" fill="#34d399"/>
  <line x1="490" y1="454" x2="710" y2="454" stroke="#334155"/>
  <rect x="490" y="473" width="145" height="30" rx="4" fill="#0f172a"/>
  <rect x="490" y="473" width="145" height="30" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="562.5" y="492" fill="#ddd6fe" font-size="10" text-anchor="middle">Built-in AI agent</text>
  <rect x="647" y="473" width="63" height="30" rx="4" fill="#0f172a"/>
  <rect x="647" y="473" width="63" height="30" rx="4" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="678.5" y="492" fill="#ddd6fe" font-size="10" text-anchor="middle">MCP</text>

  <!-- Legend is outside every boundary, 30px below their lower edge. -->
  <g font-size="9" fill="#94a3b8">
    <rect x="285" y="558" width="12" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="305" y="567">Data / AI</text>
    <rect x="445" y="558" width="12" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="465" y="567">Alerting engine</text>
    <rect x="650" y="558" width="12" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8"/>
    <text x="670" y="567">External integration</text>
    <path d="M900 563 H925" stroke="#94a3b8" marker-end="url(#arrowhead)"/>
    <text x="935" y="567">Data flow</text>
  </g>
</svg>
