<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="diagram-title diagram-description" style="font-family:'JetBrains Mono',monospace">
  <title id="diagram-title">Nightingale architecture</title>
  <desc id="diagram-description">Nightingale queries Prometheus, VictoriaMetrics, Elasticsearch, Loki, ClickHouse, and PostgreSQL. Its alert rules, event processing, and notification routing deliver alerts to Slack, PagerDuty, Discord, Email, Telegram, and Jira. A built-in AI agent and MCP server run inside Nightingale.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="engine-arrowhead" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0 0 L7 2.5 L0 5 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="1200" height="590" fill="#020617"/>
  <rect width="1200" height="590" fill="url(#grid)"/>

  <!-- Group connections are painted before all components. -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)">
    <path d="M360 200 H467"/>
    <path d="M730 400 H837"/>
  </g>
  <g fill="#cbd5e1" font-size="10" text-anchor="middle">
    <text x="415" y="183">Query results</text>
    <text x="785" y="383">Alerts</text>
  </g>

  <g font-size="13" font-weight="600" letter-spacing="0.5">
    <text x="24" y="46" fill="#a78bfa">DATA SOURCES</text>
    <text x="600" y="46" fill="#34d399" text-anchor="middle">ALERTING ENGINE</text>
    <text x="840" y="46" fill="#94a3b8">NOTIFICATION CHANNELS</text>
  </g>

  <!-- Opaque group backgrounds keep connectors out of component fills. -->
  <rect x="24" y="76" width="336" height="454" rx="10" fill="#0b1120" stroke="#334155"/>
  <rect x="840" y="76" width="336" height="454" rx="10" fill="#0b1120" stroke="#334155"/>
  <g fill="#94a3b8" font-size="10">
    <text x="44" y="104">Query data where it lives</text>
    <text x="860" y="104">Deliver to your existing tools</text>
  </g>

  <g data-component="Prometheus">
    <rect x="44" y="132" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="44" y="132" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="114" y="157" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Prometheus</text>
    <text x="114" y="176" fill="#94a3b8" font-size="9" text-anchor="middle">Metrics</text>
  </g>
  <g data-component="VictoriaMetrics">
    <rect x="200" y="132" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="200" y="132" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="270" y="157" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">VictoriaMetrics</text>
    <text x="270" y="176" fill="#94a3b8" font-size="9" text-anchor="middle">Metrics</text>
  </g>
  <g data-component="Elasticsearch">
    <rect x="44" y="272" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="44" y="272" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="114" y="297" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Elasticsearch</text>
    <text x="114" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">Logs</text>
  </g>
  <g data-component="Loki">
    <rect x="200" y="272" width="140" height="60" rx="6" fill="#0f172a"/>
    <rect x="200" y="272" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="270" y="297" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Loki</text>
    <text x="270" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">Logs</text>
  </g>
  <g data-component="ClickHouse">
